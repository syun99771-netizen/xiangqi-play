name: Verify and sync public release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xiangqi-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node verify-manifest.mjs
      - name: Download pinned CC0 model
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/fairy-stockfish/Fairy-Stockfish-NNUE/5fbbb9e15fd882cec18a2a5c3d4bfa25dc07169b/xiangqi-c07e94a5c7cb.nnue' -o models/xiangqi-c07e94a5c7cb.nnue
          echo 'c07e94a5c7cbeae443ed79a8fa412875d833a7f8e04333815e39729c59d52e11  models/xiangqi-c07e94a5c7cb.nnue' | sha256sum --check
      - run: npm test
      - run: node scripts/build-pages.mjs
      - name: Require scoped publishing credential
        env:
          RELEASE_TOKEN: ${{ secrets.XIANGQI_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Set XIANGQI_RELEASE_TOKEN in the private repository Actions secrets.'
            exit 1
          fi
      - name: Checkout public release repository
        uses: actions/checkout@v4
        with:
          repository: syun99771-netizen/xiangqi-play
          ref: main
          path: release
          token: ${{ secrets.XIANGQI_RELEASE_TOKEN }}
      - name: Copy only validated release files
        run: node scripts/prepare-release.mjs . ../release "$GITHUB_SHA"
      - name: Push release snapshot without changing public workflow
        working-directory: release
        run: |
          git config user.name 'xiangqi-release[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source release.json
          if git diff --cached --quiet; then
            echo 'Release already synchronized.'
            exit 0
          fi
          git commit -m "Release source ${GITHUB_SHA}"
          git push origin HEAD:main
