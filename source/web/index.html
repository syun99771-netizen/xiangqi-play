<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>象棋 · 与引擎对弈</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">XIANGQI / 浏览器引擎</span><h1>落子，见真章。</h1><p>纯 JavaScript · CC0 神经网络 · 本地运算</p></header><div class="layout"><section class="board-wrap" aria-label="象棋对弈"><div id="board" role="group" aria-label="棋盘"></div></section><aside><h2>与引擎对弈</h2><p id="status" role="status" aria-live="polite">准备棋盘…</p><label for="side">我的执色</label><select id="side"><option value="1">红方 · 先手</option><option value="-1">黑方 · 后手</option></select><label for="seconds">引擎每步思考（秒）</label><input id="seconds" type="number" min="0.1" max="60" step="0.1" value="3"><small>0.1–60 秒，下一步生效。首次加载约 11 MB 模型，不计入思考时间。</small><div class="actions"><button id="restart">重新开始</button><button id="retry" hidden>重试引擎</button></div><p id="stats">点击棋子，再点击落点。</p><details><summary>本局棋谱</summary><p id="moves">尚未落子</p></details><footer><p id="version">版本读取中</p></footer></aside></div></main><script type="module" src="app.mjs"></script></body></html>
